version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: daphne -b 0.0.0.0 -p 8000 warehouse_manager.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    develop:
      watch:
        - path: .
          target: /app
          action: sync

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    command: npm start
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
