{% extends "admin/index.html" %} {% load static %} {% block content %}

<!-- Dodaj wykresy po istniejącej zawartości -->
<div class="row mt-4">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">📊 Statystyki:</h3>
      </div>
      <div class="card-body">
        <div class="row">
          <!-- Wykres miesięczny -->
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                <h5>Trend miesięczny</h5>
              </div>
              <div class="card-body">
                <canvas id="lineChart" width="400" height="200"></canvas>
              </div>
            </div>
          </div>
          <!-- Wykres tygodniowy -->
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                <h5>Zamówienia w ostatnich dniach</h5>
              </div>
              <div class="card-body">
                <canvas id="barChart" width="400" height="200"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="row mt-4">
          <!-- Wykres kołowy -->
          <div class="col-md-6 offset-md-3">
            <div class="card">
              <div class="card-header">
                <h5>Status zamówień</h5>
              </div>
              <div class="card-body">
                <canvas id="pieChart" width="400" height="200"></canvas>
              </div>
            </div>
          </div>
        </div>
        <!-- Statystyki liczbowe -->
        <div class="row mt-4" id="statsRow" style="display: none">
          <div class="col-md-3">
            <div class="info-box bg-info">
              <span class="info-box-icon"><i class="fas fa-shopping-cart"></i></span>
              <div class="info-box-content">
                <span class="info-box-text">Łącznie zamówień</span>
                <span class="info-box-number" id="totalOrders">0</span>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="info-box bg-success">
              <span class="info-box-icon"><i class="fas fa-industry"></i></span>
              <div class="info-box-content">
                <span class="info-box-text">Wyprodukowane</span>
                <span class="info-box-number" id="produced">0</span>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="info-box bg-warning">
              <span class="info-box-icon"><i class="fas fa-exclamation-triangle"></i></span>
              <div class="info-box-content">
                <span class="info-box-text">Oczekujące</span>
                <span class="info-box-number" id="pending">0</span>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="info-box bg-danger">
              <span class="info-box-icon"><i class="fas fa-percentage"></i></span>
              <div class="info-box-content">
                <span class="info-box-text">Wskaźnik produkcji</span>
                <span class="info-box-number" id="productionRate">0%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/dashboard-statistics/', {
      credentials: 'same-origin',
    })
      .then((res) => res.json())
      .then((data) => {
        // Statystyki liczbowe
        document.getElementById('totalOrders').textContent = data.statistics.total_orders;
        document.getElementById('produced').textContent = data.statistics.produced_orders;
        document.getElementById('pending').textContent = data.statistics.pending_orders;
        document.getElementById('productionRate').textContent =
          data.statistics.production_rate + '%';
        document.getElementById('statsRow').style.display = '';

        // Bar Chart - Zamówienia dziennie
        new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: {
            labels: data.daily_orders.map((x) => x.day + ' ' + x.date),
            datasets: [
              {
                label: 'Zamówienia dziennie',
                data: data.daily_orders.map((x) => x.count),
                backgroundColor: '#10b981',
                borderColor: '#059669',
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: 'Zamówienia w ostatnich 7 dniach' },
            },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
          },
        });

        // Line Chart - Trend miesięczny
        new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
            labels: data.monthly_orders.map((x) => x.short_month),
            datasets: [
              {
                label: 'Zamówienia miesięcznie',
                data: data.monthly_orders.map((x) => x.count),
                fill: false,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                tension: 0.1,
                pointBackgroundColor: '#2563eb',
                pointBorderColor: '#1d4ed8',
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: 'Trend zamówień w ostatnich miesiącach' },
            },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
          },
        });

        // Pie Chart - Status zamówień
        new Chart(document.getElementById('pieChart'), {
          type: 'pie',
          data: {
            labels: ['Wyprodukowane', 'Oczekujące'],
            datasets: [
              {
                data: [data.statistics.produced_orders, data.statistics.pending_orders],
                backgroundColor: ['#10b981', '#f59e42'],
                borderColor: ['#059669', '#ea580c'],
                borderWidth: 2,
              },
            ],
          },
        });
      });
  });
</script>

<style>
  .info-box {
    display: block;
    min-height: 90px;
    background: #fff;
    width: 100%;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    border-radius: 2px;
    margin-bottom: 15px;
  }
  .info-box-icon {
    border-top-left-radius: 2px;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-left-radius: 2px;
    display: block;
    float: left;
    height: 90px;
    width: 90px;
    text-align: center;
    font-size: 45px;
    line-height: 90px;
    background: rgba(0, 0, 0, 0.2);
  }
  .info-box-content {
    padding: 5px 10px;
    margin-left: 90px;
  }
  .info-box-text {
    text-transform: uppercase;
    font-weight: bold;
    font-size: 13px;
  }
  .info-box-number {
    display: block;
    font-weight: bold;
    font-size: 18px;
  }
  .bg-info .info-box-icon,
  .bg-success .info-box-icon,
  .bg-warning .info-box-icon,
  .bg-danger .info-box-icon {
    color: #fff;
  }
</style>
{% endblock %}
